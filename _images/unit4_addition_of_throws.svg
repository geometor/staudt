<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 780 450" role="img" aria-label="Von Staudt Beiträge § 19 (Arts. 256–267): Pure Straightedge Addition of Throws (P2 + P3 = P5)">
  <title>Von Staudt Beiträge § 19 (Arts. 256–267): Pure Straightedge Addition of Throws (P2 + P3 = P5)</title>
  <desc>Straightedge addition on carrier line (P0, P1, P_inf) using horizon centers U, V on [P_inf U] and perspective axis a = [P_inf R].</desc>
  <style>
    .euclid-graphic { width: 100%; height: auto; max-width: 780px; display: block; margin: 1.25rem auto; color: currentColor; }
    .line-primary { stroke: currentColor; stroke-width: 2.0; stroke-linecap: round; fill: none; opacity: 0.92; }
    .line-guide { stroke: currentColor; stroke-width: 1.15; stroke-dasharray: 5 4; fill: none; opacity: 0.52; }
    .line-secondary { stroke: #2b7bba; stroke-width: 1.45; stroke-dasharray: 3 3; fill: none; opacity: 0.78; }
    .line-accent { stroke: #d95f02; stroke-width: 2.25; stroke-linecap: round; fill: none; }
    .line-result { stroke: #1b9e77; stroke-width: 2.4; stroke-linecap: round; fill: none; }
    .conic-locus { stroke: #d95f02; stroke-width: 2.3; fill: none; }
    .poly-fill { fill: currentColor; fill-opacity: 0.06; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
    .poly-accent { fill: #2b7bba; fill-opacity: 0.09; stroke: #2b7bba; stroke-width: 1.5; stroke-linejoin: round; }
    .pt-given { fill: currentColor; stroke: #ffffff; stroke-width: 1.3; }
    .pt-aux { fill: #2b7bba; stroke: #ffffff; stroke-width: 1.2; }
    .pt-result { fill: #d95f02; stroke: #ffffff; stroke-width: 1.6; }
    .pt-emerald { fill: #1b9e77; stroke: #ffffff; stroke-width: 1.5; }
    .glyph-label { font-family: "Libertinus Serif", "STIX Two Text", Georgia, serif; font-size: 15px; font-style: italic; fill: currentColor; paint-order: stroke; stroke: rgba(255,255,255,0.82); stroke-width: 3.2px; stroke-linejoin: round; }
    .diagram-caption { font-family: "Libertinus Sans", system-ui, sans-serif; font-size: 13px; fill: currentColor; opacity: 0.82; }
    @media (prefers-color-scheme: dark) {
      .glyph-label { stroke: rgba(20,22,26,0.88); }
      .pt-given, .pt-aux, .pt-result, .pt-emerald { stroke: #181a1f; }
    }
  </style>
  <line x1="118.50" y1="261.20" x2="661.50" y2="261.20" class="line-primary" />
  <line x1="637.37" y1="261.20" x2="215.03" y2="80.20" class="line-secondary" />
  <line x1="124.53" y1="334.46" x2="637.37" y2="261.20" class="line-accent" />
  <line x1="215.03" y1="80.20" x2="130.57" y2="333.60" class="line-guide" />
  <line x1="426.20" y1="170.70" x2="130.57" y2="333.60" class="line-guide" />
  <line x1="215.03" y1="80.20" x2="299.50" y2="261.20" class="line-guide" />
  <line x1="215.03" y1="80.20" x2="320.62" y2="306.45" class="line-guide" />
  <line x1="426.20" y1="170.70" x2="355.81" y2="261.20" class="line-result" />
  <line x1="426.20" y1="170.70" x2="320.62" y2="306.45" class="line-result" />
  <circle cx="154.70" cy="261.20" r="4.2" class="pt-given" />
  <text x="150.70" y="279.20" text-anchor="middle" class="glyph-label">P₀ (0)</text>
  <circle cx="215.03" cy="261.20" r="4.2" class="pt-given" />
  <text x="215.03" y="279.20" text-anchor="middle" class="glyph-label">P₁ (1)</text>
  <circle cx="261.96" cy="261.20" r="4.2" class="pt-given" />
  <text x="261.96" y="250.20" text-anchor="middle" class="glyph-label">P₂ (2)</text>
  <circle cx="299.50" cy="261.20" r="4.2" class="pt-given" />
  <text x="303.50" y="279.20" text-anchor="middle" class="glyph-label">P₃ (3)</text>
  <circle cx="355.81" cy="261.20" r="5.2" class="pt-result" />
  <text x="355.81" y="249.20" text-anchor="middle" class="glyph-label">P₅ = P₂ + P₃</text>
  <circle cx="637.37" cy="261.20" r="4.2" class="pt-aux" />
  <text x="645.37" y="255.20" text-anchor="start" class="glyph-label">P∞</text>
  <circle cx="215.03" cy="80.20" r="4.2" class="pt-aux" />
  <text x="207.03" y="74.20" text-anchor="end" class="glyph-label">U</text>
  <circle cx="426.20" cy="170.70" r="4.2" class="pt-aux" />
  <text x="434.20" y="164.70" text-anchor="start" class="glyph-label">V</text>
  <circle cx="130.57" cy="333.60" r="4.2" class="pt-aux" />
  <text x="140.57" y="345.60" text-anchor="start" class="glyph-label">R = [UP₀] ∩ [VP₂]</text>
  <circle cx="320.62" cy="306.45" r="4.2" class="pt-emerald" />
  <text x="310.62" y="320.45" text-anchor="end" class="glyph-label">T = [UP₃] ∩ a</text>
  <text x="390.00" y="432.00" text-anchor="middle" class="diagram-caption">Beiträge § 19: Centers U, V ∈ [P∞ U] and axis a = [P∞ R] construct P₂ + P₃ = P₅ purely by straightedge with zero circles</text>
</svg>

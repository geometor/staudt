  <text x="380.00" y="462.00" text-anchor="middle" class="diagram-caption">Geometrie der Lage §§ 18–19: Conic defined purely as self-conjugate locus P ∈ π(P), yielding tangents [Q P₂], [Q P₃] and Pascal line [M₁ M₂ M₃]</text>
</svg>

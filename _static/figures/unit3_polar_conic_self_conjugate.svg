  <text x="390.00" y="73.03" text-anchor="start" class="glyph-label">Q (pole of [P₂P₃])</text>
  <circle cx="216.67" cy="279.20" r="4.2" class="pt-given" />
  <text x="206.67" y="273.20" text-anchor="end" class="glyph-label">P₁</text>

<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 760 400" role="img" aria-label="Moritz Pasch (1882) §§ 1 &amp; 11: Open Linear Betweenness vs. 4-Point Projective Separation">
  <title>Moritz Pasch (1882) §§ 1 &amp; 11: Open Linear Betweenness vs. 4-Point Projective Separation</title>
  <desc>Segment interior points C between A and B vs. exterior point D, showing pair separation AB // CD preserved across perspective section.</desc>
  <style>
    .euclid-graphic { width: 100%; height: auto; max-width: 760px; display: block; margin: 1.25rem auto; color: currentColor; }
    .line-primary { stroke: currentColor; stroke-width: 2.0; stroke-linecap: round; fill: none; opacity: 0.92; }
    .line-guide { stroke: currentColor; stroke-width: 1.15; stroke-dasharray: 5 4; fill: none; opacity: 0.52; }
    .line-secondary { stroke: #2b7bba; stroke-width: 1.45; stroke-dasharray: 3 3; fill: none; opacity: 0.78; }
    .line-accent { stroke: #d95f02; stroke-width: 2.25; stroke-linecap: round; fill: none; }
    .line-result { stroke: #1b9e77; stroke-width: 2.4; stroke-linecap: round; fill: none; }
    .conic-locus { stroke: #d95f02; stroke-width: 2.3; fill: none; }
    .poly-fill { fill: currentColor; fill-opacity: 0.06; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
    .poly-accent { fill: #2b7bba; fill-opacity: 0.09; stroke: #2b7bba; stroke-width: 1.5; stroke-linejoin: round; }
    .pt-given { fill: currentColor; stroke: #ffffff; stroke-width: 1.3; }
    .pt-aux { fill: #2b7bba; stroke: #ffffff; stroke-width: 1.2; }
    .pt-result { fill: #d95f02; stroke: #ffffff; stroke-width: 1.6; }
    .pt-emerald { fill: #1b9e77; stroke: #ffffff; stroke-width: 1.5; }
    .glyph-label { font-family: "Libertinus Serif", "STIX Two Text", Georgia, serif; font-size: 15px; font-style: italic; fill: currentColor; paint-order: stroke; stroke: rgba(255,255,255,0.82); stroke-width: 3.2px; stroke-linejoin: round; }
    .diagram-caption { font-family: "Libertinus Sans", system-ui, sans-serif; font-size: 13px; fill: currentColor; opacity: 0.82; }
    @media (prefers-color-scheme: dark) {
      .glyph-label { stroke: rgba(20,22,26,0.88); }
      .pt-given, .pt-aux, .pt-result, .pt-emerald { stroke: #181a1f; }
    }
  </style>
  <line x1="90.29" y1="305.86" x2="664.14" y2="305.86" class="line-primary" />
  <line x1="129.29" y1="305.86" x2="463.57" y2="305.86" class="line-accent" />
  <line x1="101.43" y1="199.07" x2="658.57" y2="106.21" class="line-secondary" />
  <line x1="352.14" y1="83.00" x2="129.29" y2="305.86" class="line-guide" />
  <line x1="352.14" y1="83.00" x2="296.43" y2="305.86" class="line-guide" />
  <line x1="352.14" y1="83.00" x2="463.57" y2="305.86" class="line-guide" />
  <line x1="352.14" y1="83.00" x2="630.71" y2="305.86" class="line-guide" />
  <circle cx="352.14" cy="83.00" r="4.2" class="pt-aux" />
  <text x="352.14" y="73.00" text-anchor="middle" class="glyph-label">S</text>
  <circle cx="129.29" cy="305.86" r="4.2" class="pt-given" />
  <text x="129.29" y="324.86" text-anchor="middle" class="glyph-label">A</text>
  <circle cx="296.43" cy="305.86" r="4.2" class="pt-result" />
  <text x="296.43" y="324.86" text-anchor="middle" class="glyph-label">C (inside AB)</text>
  <circle cx="463.57" cy="305.86" r="4.2" class="pt-given" />
  <text x="463.57" y="324.86" text-anchor="middle" class="glyph-label">B</text>
  <circle cx="630.71" cy="305.86" r="4.2" class="pt-emerald" />
  <text x="630.71" y="324.86" text-anchor="middle" class="glyph-label">D (outside AB)</text>
  <circle cx="263.00" cy="172.14" r="4.2" class="pt-aux" />
  <text x="255.00" y="164.14" text-anchor="end" class="glyph-label">A&#x27;</text>
  <circle cx="332.76" cy="160.52" r="4.2" class="pt-result" />
  <text x="328.76" y="150.52" text-anchor="middle" class="glyph-label">C&#x27;</text>
  <circle cx="386.43" cy="151.57" r="4.2" class="pt-aux" />
  <text x="392.43" y="141.57" text-anchor="start" class="glyph-label">B&#x27;</text>
  <circle cx="428.99" cy="144.48" r="4.2" class="pt-emerald" />
  <text x="436.99" y="136.48" text-anchor="start" class="glyph-label">D&#x27;</text>
  <text x="380.00" y="382.00" text-anchor="middle" class="diagram-caption">Pasch (1882) § 1 Grundsätze V–VIII &amp; Lehrsätze 19–23: C lies between A and B while D lies outside AB, yielding invariant pair separation AB // CD</text>
</svg>

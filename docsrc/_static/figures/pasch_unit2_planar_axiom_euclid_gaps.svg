  <title>Moritz Pasch (1882) § 2 IV. Grundsatz (p. 21) &amp; Resolution of Euclid I.21</title>
  <desc>Left: Pasch&#x27;s planar line-triangle separation axiom. Right: Deductive proof of Euclid I.21 ray exit E on AC by applying Pasch&#x27;s Axiom to sub-triangle AMC.</desc>

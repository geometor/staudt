<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 780 450" role="img" aria-label="Von Staudt Beiträge § 20 (Arts. 268–275): Pure Straightedge Multiplication of Throws (P2 · P3 = P6)">
  <title>Von Staudt Beiträge § 20 (Arts. 268–275): Pure Straightedge Multiplication of Throws (P2 · P3 = P6)</title>
  <desc>Straightedge multiplication on (P0, P1, P_inf) using centers U, V collinear with P0 and perspective axis a = [P_inf W].</desc>
  <style>
    .euclid-graphic { width: 100%; height: auto; max-width: 780px; display: block; margin: 1.25rem auto; color: currentColor; }
    .line-primary { stroke: currentColor; stroke-width: 2.0; stroke-linecap: round; fill: none; opacity: 0.92; }
    .line-guide { stroke: currentColor; stroke-width: 1.15; stroke-dasharray: 5 4; fill: none; opacity: 0.52; }
    .line-secondary { stroke: #2b7bba; stroke-width: 1.45; stroke-dasharray: 3 3; fill: none; opacity: 0.78; }
    .line-accent { stroke: #d95f02; stroke-width: 2.25; stroke-linecap: round; fill: none; }
    .line-result { stroke: #1b9e77; stroke-width: 2.4; stroke-linecap: round; fill: none; }
    .conic-locus { stroke: #d95f02; stroke-width: 2.3; fill: none; }
    .poly-fill { fill: currentColor; fill-opacity: 0.06; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
    .poly-accent { fill: #2b7bba; fill-opacity: 0.09; stroke: #2b7bba; stroke-width: 1.5; stroke-linejoin: round; }
    .pt-given { fill: currentColor; stroke: #ffffff; stroke-width: 1.3; }
    .pt-aux { fill: #2b7bba; stroke: #ffffff; stroke-width: 1.2; }
    .pt-result { fill: #d95f02; stroke: #ffffff; stroke-width: 1.6; }
    .pt-emerald { fill: #1b9e77; stroke: #ffffff; stroke-width: 1.5; }
    .glyph-label { font-family: "Libertinus Serif", "STIX Two Text", Georgia, serif; font-size: 15px; font-style: italic; fill: currentColor; paint-order: stroke; stroke: rgba(255,255,255,0.82); stroke-width: 3.2px; stroke-linejoin: round; }
    .diagram-caption { font-family: "Libertinus Sans", system-ui, sans-serif; font-size: 13px; fill: currentColor; opacity: 0.82; }
    @media (prefers-color-scheme: dark) {
      .glyph-label { stroke: rgba(20,22,26,0.88); }
      .pt-given, .pt-aux, .pt-result, .pt-emerald { stroke: #181a1f; }
    }
  </style>
  <line x1="103.42" y1="255.17" x2="670.55" y2="255.17" class="line-primary" />
  <line x1="224.08" y1="74.17" x2="123.53" y2="375.83" class="line-secondary" />
  <line x1="163.75" y1="299.05" x2="646.42" y2="255.17" class="line-accent" />
  <line x1="224.08" y1="74.17" x2="224.08" y2="293.56" class="line-guide" />
  <line x1="123.53" y1="375.83" x2="271.01" y2="255.17" class="line-guide" />
  <line x1="224.08" y1="74.17" x2="308.55" y2="255.17" class="line-guide" />
  <line x1="123.53" y1="375.83" x2="386.52" y2="255.17" class="line-result" />
  <circle cx="163.75" cy="255.17" r="4.2" class="pt-given" />
  <text x="153.75" y="247.17" text-anchor="end" class="glyph-label">P₀ (0)</text>
  <circle cx="224.08" cy="255.17" r="4.2" class="pt-given" />
  <text x="220.08" y="273.17" text-anchor="middle" class="glyph-label">P₁ (1)</text>
  <circle cx="271.01" cy="255.17" r="4.2" class="pt-given" />
  <text x="271.01" y="244.17" text-anchor="middle" class="glyph-label">P₂ (2)</text>
  <circle cx="308.55" cy="255.17" r="4.2" class="pt-given" />
  <text x="310.55" y="273.17" text-anchor="middle" class="glyph-label">P₃ (3)</text>
  <circle cx="386.52" cy="255.17" r="5.2" class="pt-result" />
  <text x="392.52" y="243.17" text-anchor="start" class="glyph-label">P₆ = P₂ · P₃</text>
  <circle cx="646.42" cy="255.17" r="4.2" class="pt-aux" />
  <text x="654.42" y="249.17" text-anchor="start" class="glyph-label">P∞</text>
  <circle cx="224.08" cy="74.17" r="4.2" class="pt-aux" />
  <text x="232.08" y="70.17" text-anchor="start" class="glyph-label">U</text>
  <circle cx="123.53" cy="375.83" r="4.2" class="pt-aux" />
  <text x="133.53" y="381.83" text-anchor="start" class="glyph-label">V ∈ [P₀U]</text>
  <circle cx="224.08" cy="293.56" r="4.2" class="pt-aux" />
  <text x="214.08" y="285.56" text-anchor="end" class="glyph-label">W = [UP₁] ∩ [VP₂]</text>
  <circle cx="322.30" cy="284.63" r="4.2" class="pt-emerald" />
  <text x="332.30" y="278.63" text-anchor="start" class="glyph-label">Z = [UP₃] ∩ a</text>
  <text x="390.00" y="432.00" text-anchor="middle" class="diagram-caption">Beiträge § 20: Centers U, V ∈ [P₀ U] and axis a = [P∞ W] construct P₂ · P₃ = P₆ purely by straightedge incidence</text>
</svg>

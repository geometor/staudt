[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometor-staudt"
authors = [{name = "phi ARCHITECT", email = "phi@geometor.com"}]
description = "Scholarly bilingual Book Codices and exact symbolic straightedge-only projective library for K. G. C. von Staudt's Geometrie der Lage (1847) & Beiträge (1856–1860)."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "sympy>=1.13",
    "geometor-model",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
geometor-staudt = "geometor.staudt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.staudt.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/staudt"
"Repository" = "https://github.com/geometor/staudt"
"Issues" = "https://github.com/geometor/staudt/issues"

[tool.pytest.ini_options]
pythonpath = ["src", "../model/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
